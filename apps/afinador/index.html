<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afinador Online</title>
    <style>
        body { 
            background: #0f172a; color: #f8fafc; font-family: monospace; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; margin: 0; 
        }
        .container { text-align: center; background: #1e293b; padding: 30px; border-radius: 12px; }
        #note { font-size: 6rem; font-weight: bold; color: #3b82f6; margin: 20px 0; }
        #detune { font-size: 1.5rem; color: #94a3b8; }
        .indicator { width: 100%; height: 10px; background: #334155; border-radius: 5px; margin-top: 15px; position: relative; }
        .marker { width: 4px; height: 100%; background: #10b981; position: absolute; left: 50%; transform: translateX(-50%); }
        .pointer { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; position: absolute; top: 0; left: 50%; transform: translateX(-50%); transition: left 0.1s ease-out; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; font-size: 1.1rem; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Afinador</h1>
        <button id="start-btn">Ativar Microfone</button>
        <div id="tuner-display" style="display: none;">
            <div id="note">-</div>
            <div id="detune">0 cents</div>
            <div class="indicator">
                <div class="marker"></div>
                <div class="pointer" id="pointer"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
